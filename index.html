  margin:0 0 12px;
  font-size:13px
}

  background:var(--card);
  border:1px solid var(--bd);
  border-radius:8px;
  padding:12px;
  margin-bottom:10px
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:8px

.stat b{
  display:block;
  font-size:22px

  color:var(--mut);

  border-color:var(--ac);

  color:var(--tx);
  border-color:var(--bd)

  margin:8px 0;

  color:var(--mut);
  margin-right:4px

.wait,.warn{
  color:var(--warn);
  border-color:var(--warn)

.ok{
  color:var(--ok);
  border-color:var(--ok)
}
.off{
  color:var(--bad);
  border-color:var(--bad)
}
.empty{
  color:var(--mut);

  text-align:center;
  font-size:13px
}
.scroll{
  overflow-x:auto
}
table{
  border-collapse:collapse;
  width:100%;

}
th,td{

th{
  color:var(--mut)

  border-color:var(--bd);
  border-radius:10px

  outline:2px solid color-mix(in srgb,var(--ac) 70%,white);
  outline-offset:2px
}
nav{
  max-width:1320px;
  margin:auto;
  padding:0 16px 10px;
  gap:6px
}
nav button{
  border-radius:8px;
  padding:7px 11px;
  transition:color .2s,background .2s,border-color .2s,transform .2s
}
nav button:hover{color:var(--tx);background:color-mix(in srgb,var(--ac) 8%,var(--card));transform:translateY(-1px)}
nav button.on{
  color:var(--ac);
  border-color:color-mix(in srgb,var(--ac) 50%,var(--bd));
  background:color-mix(in srgb,var(--ac) 9%,var(--card));
  box-shadow:inset 0 0 18px color-mix(in srgb,var(--ac) 7%,transparent)
}
main{max-width:1240px;padding:26px 22px 60px}
main>h2{
  margin:10px 0 4px;
  font-size:clamp(22px,3vw,30px);
  line-height:1.18;
  letter-spacing:-.035em;
  font-weight:750
}
main>h2:not(:first-child){margin-top:30px}
p.sub{max-width:780px;margin:0 0 18px;line-height:1.65;color:var(--mut)}
.card{
  position:relative;
  background:linear-gradient(145deg,color-mix(in srgb,var(--card) 97%,var(--ac)),var(--card) 65%);
  border-color:color-mix(in srgb,var(--bd) 85%,var(--ac));
  border-radius:12px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 8px 24px #00000012;

}
.card:hover{
  transform:translateY(-2px);
  border-color:color-mix(in srgb,var(--ac) 45%,var(--bd));
  box-shadow:0 14px 32px #0002,0 0 0 1px color-mix(in srgb,var(--ac) 8%,transparent)
}
.card:nth-of-type(2){animation-delay:.035s}.card:nth-of-type(3){animation-delay:.07s}.card:nth-of-type(4){animation-delay:.105s}.card:nth-of-type(5){animation-delay:.14s}
.stat{min-height:108px;display:flex;flex-direction:column;justify-content:center;gap:5px}
.stat b{font-size:clamp(23px,3vw,32px);letter-spacing:-.04em;color:var(--ac);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;letter-spacing:.045em;text-transform:uppercase}
.t{color:var(--ac);line-height:1.4}
.t:hover{color:var(--tx);text-decoration:underline;text-decoration-color:var(--ac);text-underline-offset:3px}
.tag{border-radius:999px;padding:2px 8px;letter-spacing:.04em}
input,select,button.b{border-radius:9px;transition:background .2s,border-color .2s,transform .2s,box-shadow .2s}
button.b{box-shadow:0 4px 12px color-mix(in srgb,var(--ac) 18%,transparent)}
button.b:hover{filter:brightness(1.08);transform:translateY(-1px)}
button.g{box-shadow:none;background:color-mix(in srgb,var(--card) 78%,transparent)}
.empty,.map-empty{border-radius:12px;background:color-mix(in srgb,var(--card) 62%,transparent);line-height:1.65}
.globe-shell{border-radius:14px;border-color:color-mix(in srgb,var(--ac) 25%,var(--bd));box-shadow:0 18px 55px #0003,0 0 34px color-mix(in srgb,var(--ac) 7%,transparent);isolation:isolate}

.globe-status{border-radius:9px;backdrop-filter:blur(12px);box-shadow:0 6px 22px #0003}
.map-toolbar small{letter-spacing:.02em}
.map-credits{line-height:1.6}
.intro-screen{background:radial-gradient(ellipse at 50% 44%,#102f3d 0,#071016 42%,#03070b 100%)}
.intro-halo{border-color:#48d8fb55;box-shadow:0 0 0 22px #48d8fb0e,0 0 0 58px #48d8fb09,0 0 100px #03b8ff24}
.intro-portrait{border-radius:24px;box-shadow:0 0 0 8px #42d9ff0a,0 0 64px #09bafc55,0 24px 70px #0008}
.intro-title{letter-spacing:.34em}
.intro-caption{text-transform:uppercase;font-size:10px;letter-spacing:.19em}
.intro-progress{border-radius:999px;background:#18313b}
.intro-progress i{border-radius:inherit}
.intro-screen button{transition:background .2s,border-color .2s,transform .2s}
.intro-screen button:hover{transform:translateY(-2px);border-color:#42d9ff}
@keyframes panel-enter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.lang-control{width:auto;min-width:58px;min-height:38px;padding:0 7px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:9px}
.assistant-launcher{position:fixed;z-index:20;right:20px;bottom:20px;border:1px solid color-mix(in srgb,var(--ac) 55%,var(--bd));border-radius:999px;background:var(--card);color:var(--tx);padding:12px 17px;box-shadow:0 12px 36px #0005;cursor:pointer;font-weight:700}

.assistant-panel.open{display:grid}
.assistant-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--bd)}
.assistant-head small{display:block;color:var(--mut);font-size:11px}
.assistant-close{border:0;background:transparent;color:var(--mut);font-size:25px;cursor:pointer}
.assistant-messages{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.assistant-msg{max-width:95%;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.55}

.assistant-msg.assistant{align-self:flex-start;background:var(--card)}
.assistant-composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--bd)}
.assistant-composer input{flex:1;min-width:0;background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:10px}
.assistant-suggestions{display:flex;gap:6px;overflow:auto;padding:8px 12px 0}
.assistant-suggestions button{white-space:nowrap;border:1px solid var(--bd);border-radius:999px;background:var(--card);color:var(--mut);padding:6px 9px;cursor:pointer;font-size:11px}
.assistant-save{margin-top:8px}
#pulse-notices{position:fixed;z-index:30;top:15px;right:16px;width:min(360px,calc(100vw - 28px));display:grid;gap:8px;pointer-events:none}
.pulse-toast{padding:11px 13px;border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:10px;background:var(--card);color:var(--tx);box-shadow:0 12px 35px #0004;font-size:12px;animation:panel-enter .25s ease-out both}
.pulse-toast[data-level="critical"]{border-left-color:#ff354d}.pulse-toast[data-level="high"]{border-left-color:#ff8b32}.pulse-toast[data-level="medium"]{border-left-color:#e4bd34}.pulse-toast[data-level="low"]{border-left-color:#43b7ff}
@media(max-width:640px){.top{flex-wrap:wrap}.top input{order:1;flex-basis:100%;width:100%}.lang-control{margin-left:auto}.assistant-launcher{right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:11px 14px}.assistant-panel{right:8px;bottom:calc(68px + env(safe-area-inset-bottom,0px));width:calc(100vw - 16px);height:min(72dvh,620px)}#pulse-notices{top:8px;right:8px}}

  .top{padding:10px 12px}
  nav{padding:0 10px 9px}

  .card{padding:14px;border-radius:11px}
  .card:hover{transform:none}
  .intro-caption{max-width:85vw;text-align:center;line-height:1.6}
}
@media(prefers-reduced-motion:reduce){
  :root{scroll-behavior:auto}
  .pulse-mark path,.card{animation:none!important}
  .card,nav button,button.b,.intro-screen button{transition:none!important}
}
