<style>
:root{
  --bg:#f4f5f7;
  --card:#fff;
  --tx:#14171c;
  --mut:#5d6673;
  --bd:#d9dde3;
  --ac:#1f6feb;
  --ok:#1a7f37;
  --warn:#9a6700;
  --bad:#cf222e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d0f12;
    --card:#161a1f;
    --tx:#e6e9ee;
    --mut:#8b94a1;
    --bd:#262c34;
    --ac:#4c8dff;
    --ok:#3fb950;
    --warn:#d29922;
    --bad:#f85149;
    color-scheme:dark
  }
}
:root[data-theme="dark"]{
  --bg:#0d0f12;
  --card:#161a1f;
  --tx:#e6e9ee;
  --mut:#8b94a1;
  --bd:#262c34;
  --ac:#4c8dff;
  --ok:#3fb950;
  --warn:#d29922;
  --bad:#f85149;
  color-scheme:dark
}
html{
  scroll-padding-top:env(safe-area-inset-top,0px)
}
*{
  box-sizing:border-box
}
body{
  margin:0;
  background:var(--bg);
  color:var(--tx);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif
}
header{
  position:sticky;
  top:env(safe-area-inset-top,0px);
  background:var(--bg);
  z-index:5;
  border-bottom:1px solid var(--bd)
}
.top{
  display:flex;
  gap:8px;
  align-items:center;
  padding:10px 12px
}
.logo{
  font-weight:800;
  letter-spacing:.12em;
  color:var(--ac)
}
.top input{
  flex:1;
  min-width:0
}
nav{
  display:flex;
  overflow-x:auto;
  gap:4px;
  padding:0 8px 8px;
  scrollbar-width:none
}
nav button{
  white-space:nowrap;
  background:none;
  border:1px solid transparent;
  color:var(--mut);
  padding:6px 10px;
  border-radius:6px;
  font-size:13px;
  font-weight:600
}
nav button.on{
  color:var(--ac);
  border-color:var(--ac)
}
main{
  max-width:980px;
  margin:0 auto;
  padding:12px
}
h2{
  margin:4px 0 2px;
  font-size:19px
}
p.sub{
  color:var(--mut);
  margin:0 0 12px;
  font-size:13px
}
.card{
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:8px;
  padding:12px;
  margin-bottom:10px
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:8px
}
.stat b{
  display:block;
  font-size:22px
}
.stat span{
  color:var(--mut);
  font-size:12px
}
input,select,button.b{
  background:var(--bg);
  color:var(--tx);
  border:1px solid var(--bd);
  border-radius:6px;
  padding:8px;
  font:inherit;
  max-width:100%
}
button.b{
  background:var(--ac);
  border-color:var(--ac);
  color:#fff;
  font-weight:600
}
button.g{
  background:none;
  color:var(--tx);
  border-color:var(--bd)
}
.row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:8px 0;
  align-items:center
}
.tag{
  display:inline-block;
  font-size:11px;
  font-weight:700;
  padding:1px 7px;
  border-radius:99px;
  border:1px solid var(--bd);
  color:var(--mut);
  margin-right:4px
}
.wait,.warn{
  color:var(--warn);
  border-color:var(--warn)
}
.ok{
  color:var(--ok);
  border-color:var(--ok)
}
.off{
  color:var(--bad);
  border-color:var(--bad)
}
.empty{
  color:var(--mut);
  border:1px dashed var(--bd);
  border-radius:8px;
  padding:16px;
  text-align:center;
  font-size:13px
}
.scroll{
  overflow-x:auto
}
table{
  border-collapse:collapse;
  width:100%;
  font-size:13px
}
th,td{
  text-align:left;
  padding:6px 8px;
  border-bottom:1px solid var(--bd);
  vertical-align:top
}
th{
  color:var(--mut)
}
small{
  color:var(--mut)
}
a{
  color:var(--ac)
}
.t{
  font-weight:600;
  text-decoration:none

.top{
  gap:8px

.top button{

  height:38px;

.intro-screen{

  inset:0;
  z-index:30;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;

  color:#effbff;
  opacity:1;
  visibility:visible;
  transition:opacity .7s,visibility .7s;
  animation:intro-failsafe .7s 4.2s forwards
}
.intro-screen.done{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  animation:none
}
.intro-halo{
  position:absolute;
  width:min(75vw,540px);
  aspect-ratio:1;
  border:1px solid #48d8fb44;
  border-radius:50%;
  box-shadow:0 0 0 22px #48d8fb0d,0 0 0 58px #48d8fb08,0 0 90px #03b8ff20;
  animation:halo-spin 12s linear infinite
}
.intro-portrait{
  position:relative;
  width:clamp(170px,27vw,290px);
  height:clamp(170px,27vw,290px);
  object-fit:cover;
  border-radius:28px;
  border:1px solid #52d9ff88;
  box-shadow:0 0 55px #09bafc55;
  animation:portrait-arrive 1.15s cubic-bezier(.16,1,.3,1) both,portrait-float 4s 1.2s ease-in-out infinite
}
.intro-title{
  position:relative;
  margin-top:22px;
  font:800 clamp(22px,4vw,34px)/1 system-ui,sans-serif;

  text-shadow:0 0 28px #31cfffaa;

}
.intro-caption{

  color:#91bac9;
  font-size:12px;
  letter-spacing:.08em;
  margin-top:9px;
  animation:intro-fade .6s .55s both
}
.intro-progress{
  position:relative;
  width:150px;
  height:2px;
  background:#18313b;
  margin-top:23px;
  overflow:hidden
}
.intro-progress i{
  display:block;
  height:100%;
  background:#42d9ff;

}
.intro-screen button{

  margin-top:18px;
  border:1px solid #4c7b8b88;
  border-radius:999px;
  background:#06121ab8;
  color:#c7efff;
  padding:8px 16px;

}
.intro-screen button:hover{

}

@media(prefers-reduced-motion:reduce){

  from{
    opacity:0;
    transform:translateY(28px) scale(.78);

  }

    opacity:1;

    filter:brightness(1) blur(0)
  }

  }

  }

  from{
    opacity:0;

  }

    opacity:1;

  }
}
@keyframes intro-load{
  from{
    width:0
  }
  to{
    width:100%
  }
}

  to{
    transform:rotate(360deg)
  }
}
@keyframes intro-failsafe{

    visibility:hidden;
    pointer-events:none
  }
}
</style>

<script>
var S=[["overview","Overview"],["breaking","Breaking News"],["social","Social Pulse"],["early","Early Signals"],["ai","AI Intelligence"],["cyber","Cyber Radar"],["tech","Tech Radar"],["map","Global Map"],["company","Companies"],["local","Local"],["sources","Source Monitor"],["notif","Notifications"]];
var DESC={
  breaking:"Latest reporting from monitored news, company, tech and AI sources.",social:"Community discussion. Popularity is not proof of accuracy.",early:"Recent community discussions gaining points. EARLY SIGNALS are unconfirmed, never breaking news.",ai:"AI releases and research from monitored sources.",cyber:"Defensive only: official advisories, CVEs and known exploited vulnerabilities.",tech:"Technology reporting from monitored sources.",company:"Official company announcements from monitored sources.",local:"Events from sources registered for India and other regions."
}
;
var Q={
  breaking:"category=in.(news,company,tech,ai)",social:"category=eq.social",early:"category=eq.social",ai:"category=eq.ai",cyber:"category=eq.cyber",tech:"category=eq.tech",company:"category=eq.company",local:"region=like.IN*"
}
;
var SEL="select=id,title,url,summary,label,platform,severity,score,published_at,detected_at,meta,sources(name)";
var C=window.PULSE||{
}
,OK=!!(C.url&&C.key),cur=(location.hash||"#overview").slice(1),T=0,term="";
var LS="pulse.rules";
function rules(){
  try{
    return JSON.parse(localStorage.getItem(LS))||[]
  }
  catch(e){
    return[]
  }
}
function setRules(r){
  try{
    localStorage.setItem(LS,JSON.stringify(r));
    return true
  }
  catch(e){
    return false
  }
}
function $(i){
  return document.getElementById(i)
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function url(u){return /^https?:\/\//i.test(u)?esc(u):"#"}
function api(p,count){var h={apikey:C.key};if(/^eyJ/.test(C.key))h.Authorization="Bearer "+C.key;if(count)h.Prefer="count=exact";
return fetch(C.url+"/rest/v1/"+p,{headers:h}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);var cr=r.headers.get("content-range");return r.json().then(function(j){return count?+String(cr).split("/")[1]:j})})}
function dur(ms){ms=Math.max(0,ms);return ms<6e4?Math.round(ms/1e3)+"s":ms<36e5?Math.round(ms/6e4)+"m":ms<864e5?Math.round(ms/36e5)+"h":Math.round(ms/864e5)+"d"}
function ago(t){return t?dur(Date.now()-Date.parse(t))+" ago":"never"}
function srch(){var q=term.replace(/[,()*]/g," ").trim();return q?"&or=(title.ilike.*"+encodeURIComponent(q)+"*,summary.ilike.*"+encodeURIComponent(q)+"*)":""}
function card(e){var m=e.meta||{},s="";if(e.severity)s+='<span class="tag off">'+esc(e.severity)+(m.cvss!=null?" "+esc(m.cvss):"")+"</span>";
if(m.known_exploited)s+='<span class="tag off">KNOWN EXPLOITED</span>';if(e.label)s+='<span class="tag">'+esc(e.label)+"</span>";
var lat=e.published_at?" · detected "+dur(Date.parse(e.detected_at)-Date.parse(e.published_at))+" after publication":"";
var v="";if(e.platform&&e.score!=null&&e.published_at)v='<br><small>≈'+(e.score/Math.max((Date.now()-Date.parse(e.published_at))/36e5,.25)).toFixed(1)+" points/hour (rough estimate) · trend state: INSUFFICIENT DATA (no baseline yet)</small>";
var d=m.discussion?' · <a href="'+url(m.discussion)+'" target="_blank" rel="noopener">Discussion</a>':"";
return '<div class="card">'+s+'<br><a class="t" href="'+url(e.url)+'" target="_blank" rel="noopener">'+esc(e.title)+'</a><br><small>'+esc(e.sources&&e.sources.name)+" · "+(e.published_at?"published "+ago(e.published_at):"publication time unknown")+lat+d+"</small>"+(e.summary?"<p>"+esc(e.summary.slice(0,280))+"</p>":"")+v+"</div>"}
function emp(t){return '<div class="empty">'+(t||"No events yet. Run the worker once (see README), then refresh.")+"</div>"}
function head(id){var n=S.filter(function(x){return x[0]==id})[0];return "<h2>"+n[1]+'</h2><p class="sub">'+(DESC[id]||"")+"</p>"}
function stat(s){var iv=s.interval_min*6e4*3;if(!s.last_run_at)return["AWAITING CONFIGURATION","wait"];if(s.status=="rate_limited")return["RATE LIMITED","warn"];if(s.status=="offline")return["OFFLINE","off"];if(s.status=="degraded")return["DEGRADED","warn"];if(Date.now()-Date.parse(s.last_success_at)>iv)return["DELAYED","warn"];return["OPERATIONAL","ok"]}
function list(id){var o=id=="social"||id=="early"?"score.desc.nullslast":"published_at.desc.nullslast";var f=id=="early"?"&published_at=gte."+new Date(Date.now()-216e5).toISOString():"";
return api("events?"+SEL+"&"+Q[id]+f+srch()+"&order="+o+"&limit=50").then(function(r){return head(id)+(r.length?r.map(card).join(""):emp(id=="early"?"No recent discussions yet. Early signals come from social sources only.":0))})}
function ov(){var d=new Date(Date.now()-864e5).toISOString();return Promise.all([api("events?select=id&limit=1",1),api("events?select=id&limit=1&detected_at=gte."+d,1),api("sources?select=*"),api("events?"+SEL+srch()+"&order=published_at.desc.nullslast&limit=8"),api("events?"+SEL+"&severity=eq.CRITICAL&order=published_at.desc.nullslast&limit=4")]).then(function(a){var ok=a[2].filter(function(s){return stat(s)[0]=="OPERATIONAL"}).length,bad=a[2].filter(function(s){var x=stat(s)[0];return x=="OFFLINE"||x=="DEGRADED"}).length;
return '<h2>Global Overview</h2><p class="sub">All figures are counted from the database.</p><div class="grid"><div class="card stat"><b>'+a[0]+'</b><span>Stored events</span></div><div class="card stat"><b>'+a[1]+'</b><span>Detected in 24h</span></div><div class="card stat"><b>'+ok+"/"+a[2].length+'</b><span>Sources operational</span></div><div class="card stat"><b>'+bad+'</b><span>Degraded or offline</span></div></div><div class="card">AI provider <span class="tag wait">NOT CONFIGURED</span> <small>Original publisher text is shown. No AI analysis is performed in this version.</small></div>'+(a[4].length?"<h2>Critical vulnerabilities</h2>"+a[4].map(card).join(""):"")+"<h2>Latest events</h2>"+(a[3].length?a[3].map(card).join(""):emp())})}
